name: Generate Financial Doc Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الفيديو (مثال: قصة نجاح شركة أبل)'
        required: true
        default: 'قصة صعود وتراجع شركة نوكيا'

jobs:
  generate-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Script & Audio with AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
        run: |
          node setup-finance-doc.js

      - name: Render Video with Remotion
        run: |
          npx remotion render FinancialDocumentary out/video.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-documentary-video
          path: out/video.mp4
